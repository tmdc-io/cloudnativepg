name: TMDC Helm chart push workflow to AWS ECR (CloudNativePG)

on:
  push:
    tags:
      - 'cnpg-operator-*'
      - 'cnpg-cluster-*'
      - 'cnpg-plugin-barman-cloud-*'

jobs:
  push-cloudnativepg-operator-chart:
    name: Push cloudnativepg-operator chart to ECR
    runs-on: ubuntu-latest
    container:
      image: rubiklabs/k8s_cli_builder:0.6.0
      credentials:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    permissions:
      id-token: write
      contents: read

    if: startsWith(github.ref, 'refs/tags/cnpg-operator-')
    steps:
    - name: Check out the repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_ECR_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Configure Git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install rsync
      run: apt-get update && apt-get install -y rsync

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#cnpg-operator-}" >> $GITHUB_OUTPUT

    - name: Package and push cloudnativepg-operator chart
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
        ECR_HOST: ${{ steps.login-ecr.outputs.registry }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_ECR_REGION }}
      run: |
        make push-oci-chart DIR=cloudnative-pg NAME=cloudnativepg-operator

  push-cloudnativepg-cluster-chart:
    name: Push cloudnativepg-cluster chart to ECR
    runs-on: ubuntu-latest
    container:
      image: rubiklabs/k8s_cli_builder:0.6.0
      credentials:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    permissions:
      id-token: write
      contents: read

    if: startsWith(github.ref, 'refs/tags/cnpg-cluster-')
    steps:
    - name: Check out the repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_ECR_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Configure Git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install rsync
      run: apt-get update && apt-get install -y rsync

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#cnpg-cluster-}" >> $GITHUB_OUTPUT

    - name: Package and push cloudnativepg-cluster chart
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
        ECR_HOST: ${{ steps.login-ecr.outputs.registry }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_ECR_REGION }}
      run: |
        make push-oci-chart DIR=cluster NAME=cloudnativepg-cluster

  push-cloudnativepg-plugin-barman-cloud-chart:
    name: Push plugin-barman-cloud chart to ECR
    runs-on: ubuntu-latest
    container:
      image: rubiklabs/k8s_cli_builder:0.6.0
      credentials:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    permissions:
      id-token: write
      contents: read

    if: startsWith(github.ref, 'refs/tags/cnpg-plugin-barman-cloud-')
    steps:
    - name: Check out the repo
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.OIDC_ROLE_ARN }}
        aws-region: ${{ secrets.AWS_ECR_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Configure Git safe directory
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install rsync
      run: apt-get update && apt-get install -y rsync

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#cnpg-plugin-barman-cloud-}" >> $GITHUB_OUTPUT

    - name: Package and push plugin-barman-cloud chart
      env:
        VERSION: ${{ steps.version.outputs.VERSION }}
        ECR_HOST: ${{ steps.login-ecr.outputs.registry }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_ECR_REGION }}
      run: |
        make push-oci-chart DIR=plugin-barman-cloud NAME=plugin-barman-cloud
