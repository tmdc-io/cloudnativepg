{{- if .Values.crds.create }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: objectstores.barmancloud.cnpg.io
spec:
  group: barmancloud.cnpg.io
  names:
    kind: ObjectStore
    listKind: ObjectStoreList
    plural: objectstores
    singular: objectstore
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              configuration:
                properties:
                  azureCredentials:
                    properties:
                      connectionString:
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      inheritFromAzureAD:
                        type: boolean
                      storageAccount:
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      storageKey:
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      storageSasToken:
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      useDefaultAzureCredentials:
                        type: boolean
                    type: object
                  data:
                    properties:
                      additionalCommandArgs:
                        items:
                          type: string
                        type: array
                      compression:
                        enum:
                        - bzip2
                        - gzip
                        - lz4
                        - snappy
                        type: string
                      encryption:
                        enum:
                        - AES256
                        - aws:kms
                        type: string
                      immediateCheckpoint:
                        type: boolean
                      jobs:
                        format: int32
                        minimum: 1
                        type: integer
                      restoreAdditionalCommandArgs:
                        items:
                          type: string
                        type: array
                    type: object
                  destinationPath:
                    minLength: 1
                    type: string
                  endpointCA:
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  endpointURL:
                    type: string
                  googleCredentials:
                    properties:
                      applicationCredentials:
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      gkeEnvironment:
                        type: boolean
                    type: object
                  historyTags:
                    additionalProperties:
                      type: string
                    type: object
                  s3Credentials:
                    properties:
                      accessKeyId:
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      inheritFromIAMRole:
                        type: boolean
                      region:
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      secretAccessKey:
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      sessionToken:
                        properties:
                          key:
                            type: string
                          name:
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    type: object
                  serverName:
                    type: string
                  tags:
                    additionalProperties:
                      type: string
                    type: object
                  wal:
                    properties:
                      archiveAdditionalCommandArgs:
                        items:
                          type: string
                        type: array
                      compression:
                        enum:
                        - bzip2
                        - gzip
                        - lz4
                        - snappy
                        - xz
                        - zstd
                        type: string
                      encryption:
                        enum:
                        - AES256
                        - aws:kms
                        type: string
                      maxParallel:
                        minimum: 1
                        type: integer
                      restoreAdditionalCommandArgs:
                        items:
                          type: string
                        type: array
                    type: object
                required:
                - destinationPath
                type: object
                x-kubernetes-validations:
                - fieldPath: .serverName
                  message: use the 'serverName' plugin parameter in the Cluster resource
                  reason: FieldValueForbidden
                  rule: '!has(self.serverName)'
              instanceSidecarConfiguration:
                properties:
                  additionalContainerArgs:
                    items:
                      type: string
                    type: array
                    x-kubernetes-validations:
                    - message: do not set --log-level in additionalContainerArgs;
                        use spec.instanceSidecarConfiguration.logLevel
                      reason: FieldValueForbidden
                      rule: '!self.exists(a, a.startsWith(''--log-level''))'
                  env:
                    items:
                      properties:
                        name:
                          type: string
                        value:
                          type: string
                        valueFrom:
                          properties:
                            configMapKeyRef:
                              properties:
                                key:
                                  type: string
                                name:
                                  default: ""
                                  type: string
                                optional:
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              properties:
                                apiVersion:
                                  type: string
                                fieldPath:
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              properties:
                                key:
                                  type: string
                                optional:
                                  default: false
                                  type: boolean
                                path:
                                  type: string
                                volumeName:
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              properties:
                                containerName:
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              properties:
                                key:
                                  type: string
                                name:
                                  default: ""
                                  type: string
                                optional:
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  logLevel:
                    default: info
                    enum:
                    - error
                    - warning
                    - info
                    - debug
                    - trace
                    type: string
                  resources:
                    properties:
                      claims:
                        items:
                          properties:
                            name:
                              type: string
                            request:
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        type: object
                    type: object
                  retentionPolicyIntervalSeconds:
                    default: 1800
                    type: integer
                type: object
              retentionPolicy:
                pattern: ^[1-9][0-9]*[dwm]$
                type: string
            required:
            - configuration
            type: object
          status:
            properties:
              serverRecoveryWindow:
                additionalProperties:
                  properties:
                    firstRecoverabilityPoint:
                      format: date-time
                      type: string
                    lastFailedBackupTime:
                      format: date-time
                      type: string
                    lastSuccessfulBackupTime:
                      format: date-time
                      type: string
                  type: object
                type: object
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
