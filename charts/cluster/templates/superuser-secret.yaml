{{- /*
Optionally creates the kubernetes.io/basic-auth secret for the PostgreSQL superuser
(postgres) referenced by cluster.superuserSecret. Enabled via
cluster.createSuperuserSecret. Password resolution order:
  1. An explicit value in .Values.superuserPassword (lets you set/rotate a known
     password without it ever touching the Cluster spec passed to CNPG).
  2. The password already stored in the existing secret (preserved across helm
     upgrades via lookup, so it is generated only once).
  3. A strong random password (generated on first install).
The secret's `username` is always `postgres`, as required by CNPG for the
`kubernetes.io/basic-auth` superuser secret.
*/ -}}
{{- if and .Values.cluster.enableSuperuserAccess .Values.cluster.createSuperuserSecret .Values.cluster.superuserSecret }}
{{- $secretName := .Values.cluster.superuserSecret }}
{{- $override := .Values.superuserPassword | default "" }}
{{- $existing := (lookup "v1" "Secret" (include "cluster.namespace" .) $secretName) }}
{{- $password := "" }}
{{- if $override }}
{{- $password = $override }}
{{- else if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "cluster.namespace" . }}
  labels:
    {{- include "cluster.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
data:
  username: {{ "postgres" | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
{{- end }}
