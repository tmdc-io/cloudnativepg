{{- /*
Creates kubernetes.io/basic-auth secrets for any cluster.roles[] that define a
passwordSecret.name. Password resolution order:
  1. An explicit value in .Values.rolePasswords.<roleName> (lets you set/rotate
     a known password without it ever touching the role spec passed to CNPG).
  2. The password already stored in the existing secret (preserved across helm
     upgrades via lookup, so it is generated only once).
  3. A strong random password (generated on first install).
The secret's `username` always matches the role name, as required by CNPG.
*/ -}}
{{- range .Values.cluster.roles }}
{{- if and .passwordSecret .passwordSecret.name }}
{{- $secretName := .passwordSecret.name }}
{{- $override := index ($.Values.rolePasswords | default dict) .name }}
{{- $existing := (lookup "v1" "Secret" (include "cluster.namespace" $) $secretName) }}
{{- $password := "" }}
{{- if $override }}
{{- $password = $override }}
{{- else if and $existing $existing.data (index $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- else }}
{{- $password = randAlphaNum 24 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "cluster.namespace" $ }}
  labels:
    {{- include "cluster.labels" $ | nindent 4 }}
type: kubernetes.io/basic-auth
data:
  username: {{ .name | b64enc | quote }}
  password: {{ $password | b64enc | quote }}
{{- end }}
{{- end }}
d